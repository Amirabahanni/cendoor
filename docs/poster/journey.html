<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cendoor: the seller journey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @page { size: 420mm 297mm; margin: 0; }
  :root { --teal: #0F5C5C; --teal2: #43B0AC; --teal-50: #EAF4F2; --orange: #F28C28; --orange-50: #FFF0DD; --ink: #17302F; --mut: #5E7573; --bg: #F6F3EE; --line: #E2DCCF; --violet: #5B4BB5; --violet-50: #ECE8FA; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", Roboto, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .poster { width: 1587px; height: 1123px; background: var(--bg); position: relative; overflow: hidden; margin: 0 auto; padding: 54px 64px 40px; display: flex; flex-direction: column; }
  .poster::before { content: ""; position: absolute; width: 900px; height: 900px; right: -260px; top: -420px; border-radius: 50%; background: radial-gradient(circle, rgba(67,176,172,.28), transparent 68%); }
  .poster::after { content: ""; position: absolute; width: 700px; height: 700px; left: -260px; bottom: -380px; border-radius: 50%; background: radial-gradient(circle, rgba(242,140,40,.2), transparent 68%); }
  header { display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 1; }
  .logo { font-weight: 800; font-size: 40px; letter-spacing: -.04em; color: var(--teal); }
  h1 { font-size: 58px; line-height: 1.02; letter-spacing: -.035em; margin: 12px 0 8px; max-width: 980px; }
  h1 em { font-style: normal; color: var(--orange); }
  .sub { font-size: 21px; color: var(--mut); }
  .legend { display: flex; gap: 14px; font-size: 14.5px; font-weight: 600; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 430px; }
  .tag { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 700; }
  .t-you { background: var(--teal); color: #fff; } .t-cus { background: var(--orange-50); color: #A85A0A; border: 1.5px solid var(--orange); } .t-ai { background: var(--violet-50); color: var(--violet); border: 1.5px solid #B9AEF0; }
  .phase { position: relative; z-index: 1; margin-top: 26px; display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
  .phase i { flex: 1; height: 2px; background: linear-gradient(90deg, var(--teal2), transparent); } [dir=rtl] .phase i { background: linear-gradient(270deg, var(--teal2), transparent); }
  .row { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; margin-top: 14px; }
  .step { background: #fff; border-radius: 26px; padding: 24px 24px 22px; box-shadow: 0 14px 40px rgba(23,48,47,.09); position: relative; min-height: 232px; display: flex; flex-direction: column; }
  .step:not(:last-child)::after { content: ""; position: absolute; top: 50%; inset-inline-end: -29px; width: 24px; height: 24px; margin-top: -12px; background: var(--teal2); clip-path: polygon(0 20%, 55% 20%, 55% 0, 100% 50%, 55% 100%, 55% 80%, 0 80%); opacity: .85; }
  [dir=rtl] .step:not(:last-child)::after { transform: scaleX(-1); }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .num { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--teal); color: #fff; font-size: 22px; font-weight: 800; }
  .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--teal-50); display: grid; place-items: center; } .ic svg { width: 28px; height: 28px; stroke: var(--teal); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  h2 { font-size: 24px; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 8px; }
  .step p { font-size: 16.5px; color: var(--mut); line-height: 1.42; flex: 1; }
  .foot { margin-top: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .note { font-size: 13px; font-weight: 700; color: var(--teal); } .note.wait { color: #A85A0A; }
  .grow { position: relative; z-index: 1; margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; }
  .g { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.72); border: 1.5px dashed #BFD6D3; border-radius: 20px; padding: 16px 18px; }
  .g .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--orange-50); flex: none; } .g .ic svg { stroke: #B25F0A; width: 25px; height: 25px; }
  .g b { display: block; font-size: 18px; letter-spacing: -.01em; } .g span { font-size: 14.5px; color: var(--mut); }
  footer { position: relative; z-index: 1; margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 18px; gap: 30px; }
  .slogan { font-size: 26px; font-weight: 800; letter-spacing: -.03em; } .slogan em { font-style: normal; color: var(--orange); }
  .fine { font-size: 13.5px; color: var(--mut); max-width: 700px; line-height: 1.4; }
  .url { font-weight: 800; font-size: 20px; color: var(--teal); }
  .shot { position: absolute; inset-inline-end: 14px; bottom: 12px; display: flex; }
  .shot img { width: 62px; height: 78px; object-fit: cover; border-radius: 10px; border: 2.5px solid #fff; box-shadow: 0 8px 18px rgba(0,0,0,.2); margin-inline-start: -16px; } .shot img:first-child { margin-inline-start: 0; }
  @media screen { body { padding: 0; } }

  /* brand theme: same as the landing page, the dashboard and the deck */
  :root { --ink: #eef6f7; --mut: #93a8ad; --bg: #04070d; --line: rgba(255,255,255,.1); --grad: linear-gradient(120deg, #2dd4bf, #22d3ee 45%, #8b5cf6); }
  html, body { background: #04070d; }
  .poster { background: #04070d; color: #eef6f7; }
  .poster::before { background: radial-gradient(circle, rgba(45,212,191,.26), transparent 68%); }
  .poster::after { background: radial-gradient(circle, rgba(139,92,246,.24), transparent 68%); }
  .logo { color: #eef6f7; } .logo b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { color: #fff; } h1 em { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--mut); }
  .t-you { background: rgba(45,212,191,.2); color: #5eead4; border: 1.5px solid rgba(45,212,191,.5); } .t-cus { background: rgba(242,140,40,.16); color: #ffb067; border: 1.5px solid rgba(242,140,40,.55); } .t-ai { background: rgba(139,92,246,.2); color: #c4b8ff; border: 1.5px solid rgba(139,92,246,.55); }
  .phase { color: #5eead4; } .phase i { background: linear-gradient(90deg, rgba(45,212,191,.6), transparent); } [dir=rtl] .phase i { background: linear-gradient(270deg, rgba(45,212,191,.6), transparent); }
  .step { background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .step:not(:last-child)::after { background: #2dd4bf; opacity: .9; }
  .num { background: var(--grad); color: #04121a; }
  .ic { background: rgba(45,212,191,.14); } .ic svg { stroke: #2dd4bf; }
  h2 { color: #fff; } .step p { color: var(--mut); }
  .note { color: #5eead4; } .note.wait { color: #ffb067; }
  .g { background: rgba(255,255,255,.05); border: 1.5px dashed rgba(45,212,191,.4); }
  .g .ic { background: rgba(242,140,40,.16); } .g .ic svg { stroke: #ffb067; }
  .g b { color: #fff; } .g span { color: var(--mut); }
  .slogan { color: #fff; } .slogan em { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fine { color: #7c9297; } .url { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="poster" id="p">
  <header>
    <div><div class="logo"><span>cen<b>door</b></span></div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="phase"><span id="ph1"></span><i></i></div>
  <div class="row" id="row1"></div>
  <div class="phase" style="margin-top:22px"><span id="ph2"></span><i></i></div>
  <div class="row" id="row2"></div>

<script>

const D = {

  fr: { dir: 'ltr', title: 'D’un post à une <em>commande livrée</em>', sub: 'Le parcours du vendeur, étape par étape : ce que vous faites, ce que fait le client, ce que fait Cendoor.',
